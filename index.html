<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4ec"><title>pam.io — Snake arena</title></head><body>
<canvas id="arena"></canvas>
<header><strong class="brand">pam<span>.io</span></strong><button id="mute" aria-label="Toggle sound"></button></header>
<main id="menu"><div class="setup"><p class="caption" id="state">SINGLE PLAYER</p><h1 id="title">Snake arena<span>.</span></h1><p id="intro">Collect orbs. Cut off rivals. Take the crown.</p>
<div class="field"><label for="nickname">Nickname</label><input id="nickname" maxlength="16" placeholder="Player" autocomplete="off"></div>
<button id="play">Enter arena</button><div class="hint desktop"><kbd>WASD</kbd> steer <i></i><kbd>Space</kbd> boost</div><div class="hint mobile">Drag to steer · Hold boost to sprint</div></div>
<section class="skinbox" aria-label="Snake selection"><div class="plate"><span>SKIN SELECT</span><span id="count"></span></div><canvas id="preview" width="800" height="490"></canvas><div class="selector"><strong id="skinname"></strong><div><button id="prev" aria-label="Previous skin">←</button><button id="next" aria-label="Next skin">→</button></div></div></section></main>
<div id="hud"></div><aside class="board"><button id="scores" aria-expanded="false">Leaderboard</button><div id="rows"></div></aside><div class="radar"><canvas id="map" width="160" height="160"></canvas></div><div id="notice"></div><div id="stick" aria-label="Steer"><i></i></div><button id="boost">Boost</button>
<script type="module" src="/src/main.ts"></script></body></html>
