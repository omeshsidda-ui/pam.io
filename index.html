<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101f34" />
    <title>PAM.IO · Snake Arena</title>
  </head>
  <body data-screen="home">
    <canvas id="arena" aria-label="Snake arena"></canvas>
    <section id="home" class="screen">
      <nav>
        <button
          class="round"
          id="skins"
          aria-label="Open skins"
          data-icon="skins"
        ></button
        ><button
          class="round"
          id="settings"
          aria-label="Open settings"
          data-icon="settings"
        ></button>
      </nav>
      <div class="record glass">
        <i data-icon="cup"></i>
        <div><small>BEST SCORE</small><strong id="best">0</strong></div>
      </div>
      <div class="home-stack">
        <h1>PAM<span>.IO</span></h1>
        <div class="home-card glass">
          <div class="outfit">
            <canvas id="outfit" width="300" height="110"></canvas>
            <div><small>YOUR SNAKE</small><strong id="equipped"></strong></div>
            <button class="edit" id="change">Change</button>
          </div>
          <label for="nickname">Nickname</label>
          <div class="input">
            <i data-icon="pencil"></i
            ><input
              id="nickname"
              maxlength="16"
              placeholder="Player"
              autocomplete="off"
            />
          </div>
          <button id="play" class="primary">
            <i data-icon="play"></i>PLAY
          </button>
        </div>
      </div>
      <div class="tips">
        <span><kbd>Mouse / WASD</kbd> Steer</span
        ><span><kbd>Click / Space</kbd> Boost</span>
      </div>
      <button class="round audio" id="mute" aria-label="Toggle sound"></button>
    </section>
    <section id="shop" class="screen overlay">
      <div class="shop-heading">
        <button
          class="round back"
          aria-label="Back home"
          data-icon="back"
        ></button>
        <h2>Skin shop</h2>
      </div>
      <div class="shop-layout">
        <div id="categories" class="glass"></div>
        <div id="cards"></div>
        <div class="details glass">
          <div>
            <h3 id="skin-name"></h3>
            <p id="condition"></p>
            <progress id="milestone" max="1"></progress>
          </div>
          <button id="use" class="primary">USE</button>
        </div>
      </div>
    </section>
    <section id="options" class="screen overlay centered">
      <div class="panel glass">
        <h2>Control setup</h2>
        <fieldset>
          <legend>Handedness</legend>
          <div id="hands" class="choices"></div>
        </fieldset>
        <fieldset>
          <legend>Steering</legend>
          <div id="modes" class="choices"></div>
        </fieldset>
        <button id="audio-option"></button
        ><button class="primary back">OK</button>
      </div>
    </section>
    <section id="game" class="screen">
      <div class="score">
        <strong id="hud">0</strong>
        <div id="boss" hidden>
          <small id="charge-label">Find the bolt circle</small>
          <div role="progressbar" aria-label="Bolt charge" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i><i></i><i></i></div>
        </div>
      </div>
      <aside class="board glass">
        <button id="scores" aria-expanded="true">
          Leaderboard <span>⌃</span>
        </button>
        <div id="rows"></div>
      </aside>
      <div id="notice"></div>
      <div id="stick"><i></i></div>
      <button id="boost" aria-label="Boost" data-icon="bolt"></button>
    </section>
    <section id="results" class="screen centered overlay">
      <div class="panel glass">
        <h2 id="result-title">Game over</h2><p id="death-cause"></p>
        <table>
          <thead>
            <tr>
              <th></th>
              <th>This Game</th>
              <th>All Time</th>
            </tr>
          </thead>
          <tbody id="stats"></tbody>
        </table>
        <div class="actions">
          <button class="back">HOME</button
          ><button id="again" class="primary">PLAY AGAIN</button>
        </div>
      </div>
    </section>
    <div id="rotate">
      <i data-icon="phone"></i>
      <h2>Rotate your phone<br />to play in landscape</h2>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
